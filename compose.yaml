name: fsa-food-ordering

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  client:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-fsa-food-ordering}:client-${RELEASE_TAG:-latest}"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  dashboard:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-fsa-food-ordering}:dashboard-${RELEASE_TAG:-latest}"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging

  server:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY:-fsa-food-ordering}:server-${RELEASE_TAG:-latest}"
    restart: unless-stopped
    init: true
    env_file:
      - "${SERVER_ENV_FILE:-./deploy/server.env}"
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      client:
        condition: service_healthy
      dashboard:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      CUSTOMER_DOMAIN: "${CUSTOMER_DOMAIN:?Set CUSTOMER_DOMAIN}"
      DASHBOARD_DOMAIN: "${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
