name: CI and Docker Hub

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ci-cd
  workflow_dispatch:

concurrency:
  group: ci-dockerhub-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'fsa-food-ordering' }}

jobs:
  quality:
    name: Typecheck, build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build applications
        run: npm run build

      - name: Lint dashboard
        run: npm run lint --workspace client-dashboard

      - name: Test dashboard
        run: npm run test --workspace client-dashboard

  publish:
    name: Publish ${{ matrix.component }} image
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - component: client
            dockerfile: docker/client.Dockerfile
          - component: dashboard
            dockerfile: docker/dashboard.Dockerfile
          - component: server
            dockerfile: docker/server.Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Repository variable DOCKERHUB_USERNAME is required." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.component }}-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_REPOSITORY }}:${{ matrix.component }}-latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
